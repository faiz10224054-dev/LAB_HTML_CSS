<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampus News Up - STT Cipasung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    STT CIPASUNG
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMenu">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link active" href="#beranda">Beranda</a>
                        <a class="nav-link" href="#berita">Berita</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <div class="mb-4">
            <h1 class="fw-bold text-success">Campus News</h1>
            <p class="text-secondary">
                Informasi dan berita terbaru seputar kegiatan kampus.
            </p>
        </div>

        <section class="card border-0 shadow-sm rounded-4 overflow-hidden">

            <img src="https://placehold.co/600x200?text=News" class="card-img-top img-fluid"
                alt="Ilustrasi berita kampus">

            <div class="card-body p-4">

                <h5 class="card-title fw-bold text-success mb-3">
                    Berita Terbaru
                </h5>

                <ul id="newsList" class="list-group list-group-flush">

                    <li class="list-group-item py-3">
                        <span class="badge bg-success me-2">Info</span>
                        New library books have arrived
                    </li>

                    <li class="list-group-item py-3">
                        <span class="badge bg-success me-2">Event</span>
                        Coding Day registration is open
                    </li>

                </ul>

            </div>
        </section>

    </main>

    <footer class="bg-success text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">
                &copy; 2026 STT Cipasung. All Rights Reserved.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
